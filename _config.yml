title: "NPNgocThanh99 — Dev Blog"
description: "Ghi chép hành trình học tập của một Software Engineer. Java · Spring · React · Docker."
url: "https://NPNgocThanh99.github.io"
baseurl: ""
author:
  name: "Nguyễn Phúc Ngọc Thành"
  github: "NPNgocThanh99"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 10
paginate_path: "/page/:num/"

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - README.md
